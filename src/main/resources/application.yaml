spring:
  application:
    name: funcionario-documento
  datasource:
    url: jdbc:h2:mem:demodb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    context-path: /beneficiario-documento/api

springdoc:
  swagger-ui:
    enabled: true
    path: /public/swagger
  api-docs:
    enabled: true
    path: /v1/api-docs

security:
  token:
    jwt:
      secret: pedrolucascg
      expiration: 8